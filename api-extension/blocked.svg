<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004d40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bgGradient)" rx="0" ry="0" />
  <g filter="url(#shadow)">
    <path d="M100 20 C60 20 30 50 30 90 C30 130 70 160 100 180 C130 160 170 130 170 90 C170 50 140 20 100 20 Z" fill="url(#shieldGradient)" />
    <circle cx="100" cy="70" r="18" fill="white" />
    <path d="M85 100 L100 115 L115 85" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="100" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#17212b" text-anchor="middle">Modesty protects you</text>
  <text x="100" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a32020" text-anchor="middle">content blocked</text>
</svg>
